[project]
name = "mmc-model"
version = "0.1.0"
description = "Simulation and analysis of standalone MMC dynamic tests for interoperability"
authors = [
    {name = "CGerald13",email = "kpugerald@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas (>=3.0.2,<4.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "mhi-pscad (>=3.1.1,<4.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
]

[tool.poetry]
packages = [{include = "mmc_model", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
